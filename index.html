<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Analytics & Airdrop Checker</title>
  <!-- โหลด Tailwind CSS ผ่าน CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-start p-6">

  <div class="max-w-xl w-full bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mt-10">
    <h1 class="text-2xl font-bold mb-4 text-blue-400 text-center">Base Wallet Advanced Checker</h1>
    
    <div class="flex gap-2 mb-6">
      <input id="addressInput" type="text" value="0xfc0cbfbc5245fd333efba768ceeedb3ef66d602e" placeholder="Enter EVM Address (0x...)" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-blue-500 text-white">
      <button onclick="checkWallet()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-3 rounded-lg font-medium transition">Check</button>
    </div>

    <div id="result" class="hidden space-y-3 bg-slate-900 p-4 rounded-lg border border-slate-700 text-sm"></div>
  </div>

  <script>
    async function checkWallet() {
      const address = document.getElementById('addressInput').value.trim();
      const resultDiv = document.getElementById('result');
      if (!address) return;

      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = '<p class="text-gray-400 text-center">Fetching On-chain Data...</p>';

      try {
        const res = await fetch(`https://base.blockscout.com/api?module=account&action=txlist&address=${address}&startblock=0&endblock=99999999&sort=asc`);
        const data = await res.json();

        if (data.status !== '1' || !data.result.length) {
          resultDiv.innerHTML = '<p class="text-red-400 text-center">No transactions found or API limit reached.</p>';
          return;
        }

        const txs = data.result;
        const contracts = new Set(txs.map(t => t.to).filter(Boolean));
        const activeMonths = new Set(txs.map(t => {
          const d = new Date(t.timeStamp * 1000);
          return `${d.getFullYear()}-${d.getMonth() + 1}`;
        }));

        let gasPaidETH = txs.reduce((acc, t) => acc + (BigInt(t.gasUsed) * BigInt(t.gasPrice)), 0n);
        let gasEthFormatted = (Number(gasPaidETH) / 1e18).toFixed(5);

        let score = 0;
        if (txs.length >= 10) score += 20;
        if (txs.length >= 50) score += 20;
        if (contracts.size >= 5) score += 20;
        if (activeMonths.size >= 3) score += 20;
        if (parseFloat(gasEthFormatted) >= 0.005) score += 20;

        resultDiv.innerHTML = `
          <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-gray-400">Address:</span><span class="font-mono text-xs text-blue-300">${address.slice(0,6)}...${address.slice(-4)}</span></div>
          <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-gray-400">Total Transactions:</span><span class="font-bold">${txs.length}</span></div>
          <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-gray-400">Unique Contracts:</span><span class="font-bold">${contracts.size}</span></div>
          <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-gray-400">Active Months:</span><span class="font-bold">${activeMonths.size}</span></div>
          <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-gray-400">Gas Spent:</span><span class="font-bold text-yellow-400">${gasEthFormatted} ETH</span></div>
          <div class="flex justify-between pt-2"><span class="text-gray-400">Health Score:</span><span class="font-bold text-green-400">${score} / 100</span></div>
        `;
      } catch (err) {
        resultDiv.innerHTML = '<p class="text-red-400 text-center">Error loading data. Please try again.</p>';
      }
    }
  </script>
</body>
</html>
